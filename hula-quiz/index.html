<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חידון עמק החולה</title>
<style>
  :root {
    --bg: #eef5ef;
    --ink: #1f2a24;
    --muted: #5b6b61;
    --accent: #2f7d5b;
    --accent-dark: #1f5a40;
    --card: #ffffff;
    --line: #d5e3d9;
    --good: #2e8b57;
    --good-bg: #e3f4e9;
    --bad: #c0392b;
    --bad-bg: #fbe9e7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; min-height: 100vh;
  }
  .card {
    width: min(100%, 720px);
    background: var(--card); border-radius: 20px;
    box-shadow: 0 6px 24px rgba(31, 42, 36, .10);
    padding: clamp(18px, 4vw, 32px);
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .count { font-size: clamp(14px, 2.2vw, 16px); color: var(--muted); font-weight: 600; }
  .score { font-size: clamp(14px, 2.2vw, 16px); color: var(--accent-dark); font-weight: 700; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
  h1 { margin: 0 0 8px; font-size: clamp(24px, 4.4vw, 34px); text-align: center; }
  h2 { margin: 0 0 18px; font-size: clamp(20px, 3.6vw, 27px); line-height: 1.4; }
  p.lead { margin: 0 0 22px; text-align: center; font-size: clamp(16px, 2.6vw, 19px); color: var(--muted); line-height: 1.5; }
  .options { display: grid; gap: 10px; }
  .opt {
    font: inherit; font-size: clamp(17px, 2.8vw, 20px); text-align: right;
    background: #f7faf8; color: var(--ink);
    border: 2px solid var(--line); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; line-height: 1.35;
    transition: border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: #eef7f1; }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: var(--good-bg); font-weight: 700; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.correct::before { content: "✓ "; color: var(--good); }
  .opt.wrong::before { content: "✗ "; color: var(--bad); }
  .feedback {
    margin-top: 16px; padding: 14px 16px; border-radius: 14px;
    font-size: clamp(16px, 2.6vw, 18px); line-height: 1.5; display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); }
  .feedback.bad { background: var(--bad-bg); }
  .feedback b { display: block; margin-bottom: 4px; }
  .actions { display: flex; justify-content: center; margin-top: 20px; }
  .btn {
    font: inherit; font-size: clamp(18px, 3vw, 21px); font-weight: 700;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 12px 38px; cursor: pointer; box-shadow: 0 3px 0 var(--accent-dark);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }
  .btn:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }
  .hidden { display: none !important; }
  .final { text-align: center; }
  .big { font-size: clamp(44px, 9vw, 64px); font-weight: 800; color: var(--accent-dark); margin: 6px 0; }
</style>
</head>
<body>
<main class="card" aria-live="polite">

  <section id="start" class="final">
    <h1>חידון עמק החולה</h1>
    <p class="lead">בחנו את עצמכם: עד כמה אתם מכירים את עמק החולה?<br>13 שאלות על מה שלמדנו בשיעור.</p>
    <div class="actions"><button class="btn" id="go" type="button">מתחילים!</button></div>
  </section>

  <section id="quiz" class="hidden">
    <div class="top">
      <span class="count" id="count"></span>
      <span class="score" id="score"></span>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <h2 id="q"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="next" type="button">לשאלה הבאה</button></div>
  </section>

  <section id="end" class="final hidden">
    <h1>סיימתם!</h1>
    <div class="big" id="final"></div>
    <p class="lead" id="msg"></p>
    <div class="actions"><button class="btn" id="again" type="button">משחקים שוב</button></div>
  </section>

</main>

<script>
  // ===== השאלות: התשובה הנכונה היא תמיד הראשונה ברשימה (הסדר מעורבב במסך) =====
  var QUESTIONS = [
    {
      q: "איפה נמצא עמק החולה?",
      a: ["באצבע הגליל, בצפון הארץ", "בנגב, בדרום הארץ", "בשפלה, ליד תל אביב", "בערבה, ליד אילת"],
      why: "עמק החולה נמצא באצבע הגליל, בצפון הארץ."
    },
    {
      q: "מהו עמק?",
      a: ["אזור נמוך מסביבתו, שבדרך כלל מוקף בהרים וגבעות", "הר גבוה עם שלג בפסגה", "חוף ים רחב עם חול", "מדבר יבש בלי מים"],
      why: "עמק הוא אזור גאוגרפי הנמוך מסביבתו, ובדרך כלל מוקף בהרים וגבעות."
    },
    {
      q: "עמק החולה הוא חלקו הצפוני של...",
      a: ["בקע הירדן", "הרי אילת", "עמק יזרעאל", "מכתש רמון"],
      why: "העמק הוא חלקו הצפוני של בקע הירדן, שהוא חלק מהבקע הסורי־אפריקאי."
    },
    {
      q: "מה יוצר צורות נוף שונות על פני כדור הארץ, כמו הבקע?",
      a: ["לוחות סלע ענקיים שזזים לאט מאוד במשך מיליוני שנים", "גשמים חזקים שיורדים בחורף", "רוחות חזקות שמעיפות חול", "אנשים שחפרו את האדמה"],
      why: "החלק החיצוני של כדור הארץ בנוי מלוחות ענקיים של סלעים, שנעים בתנועות איטיות כבר מיליוני שנים. תוך כדי התנועה נוצרות צורות נוף שונות."
    },
    {
      q: "לאורך איזה נהר עובר קו השבר הסורי־אפריקאי בארץ?",
      a: ["נהר הירדן", "נחל הירקון", "נחל הקישון", "נחל שורק"],
      why: "קו השבר משתרע לאורך נהר הירדן, ממקורות הירדן ועד ים המלח."
    },
    {
      q: "מה קרה לאגמים בעמק בתקופות של בצורת?",
      a: ["הם הפכו לביצות, הצמחים נרקבו ונוצרה אדמת כבול", "הם הפכו לים גדול", "הם קפאו והפכו לקרח", "הם הפכו להרים"],
      why: "בתקופות בצורת האגמים הפכו לביצות, הצמחים נרקבו בהם ונוצרה אדמת כבול."
    },
    {
      q: "מהו אגמון החולה?",
      a: ["אגם מלאכותי במרכז עמק החולה", "האגם הגדול ביותר בארץ", "נחל שזורם לים התיכון", "מעיין חם בתוך מערה"],
      why: "אגמון החולה הוא אגם מלאכותי במרכז עמק החולה, וסביבו אתר תיירות."
    },
    {
      q: "אילו ציפורים מגיעות לאגמון החולה באלפים, בכל חורף?",
      a: ["עגורים", "פינגווינים", "תוכים", "יענים"],
      why: "מדי חורף מתמקמים באגמון אלפי עגורים. בגלל העופות הרבים, האגמון הוא מקום מרכזי לצפרות (צפייה בציפורים)."
    },
    {
      q: "איזו מהדרכים הבאות היא לא דרך לסייר באגמון החולה, לפי השיעור?",
      a: ["סירת מנוע", "אופניים", "רכב חשמלי", "עגלת מסתור"],
      why: "באגמון מסיירים באופניים, ברכב חשמלי או בעגלת מסתור, שממנה צופים בעופות."
    },
    {
      q: "למה נובעים באזור עמק החולה עשרות מעיינות?",
      a: ["בגלל סדקים בסלעים, שנוצרו מהתנועות של גושי הסלע", "כי יש שם הרבה ברזים ישנים", "כי הים מגיע עד לשם", "כי יורד שם שלג כל השנה"],
      why: "בגלל סדקים בסלעים של קרום כדור הארץ, שנוצרו מהתנודות בגושי הסלעים, נובעים באזור עשרות מעיינות. המים הם העיקר כאן!"
    },
    {
      q: "מהו המעיין הגדול ביותר בעמק החולה?",
      a: ["מעיין עינן", "עין גדי", "מעיין הגיחון", "עין חרוד"],
      why: "הגדול מהמעיינות בעמק החולה הוא מעיין עינן, שנובע לרגלי הרי נפתלי."
    },
    {
      q: "איזה מהנחלים הבאים זורם באזור עמק החולה?",
      a: ["נחל דן", "נחל הירקון", "נחל הבשור", "נחל צין"],
      why: "באזור עמק החולה זורמים נחל דן, נחל שניר (חצבני), נחל חרמון (בניאס), נחל עיון ונחלים נוספים."
    },
    {
      q: "איזה מהצמחים הבאים הוא צמח מים שמאפיין את אזור החולה?",
      a: ["נופר צהוב", "צבר", "שיטה", "רותם המדבר"],
      why: "באזור החולה גדלים צמחי מים כמו נופר צהוב, נמפאה לבנה, אירוס ענף, סוף צר עלים ונענת המים."
    }
  ];

  var order = [], current = 0, score = 0;
  var $ = function (id) { return document.getElementById(id); };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function start() {
    order = shuffle(QUESTIONS.map(function (_, i) { return i; }));
    current = 0; score = 0;
    $("start").classList.add("hidden"); $("end").classList.add("hidden"); $("quiz").classList.remove("hidden");
    show();
  }

  function show() {
    var item = QUESTIONS[order[current]];
    $("count").textContent = "שאלה " + (current + 1) + " מתוך " + QUESTIONS.length;
    $("score").textContent = "נקודות: " + score;
    $("bar").style.width = (current / QUESTIONS.length * 100) + "%";
    $("q").textContent = item.q;
    var box = $("options"); box.innerHTML = "";
    shuffle(item.a.map(function (text, i) { return { text: text, right: i === 0 }; })).forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.textContent = o.text;
      b.dataset.right = o.right ? "1" : "";
      b.addEventListener("click", function () { answer(b, item); });
      box.appendChild(b);
    });
    var fb = $("feedback"); fb.className = "feedback"; fb.innerHTML = "";
    $("next").classList.add("hidden");
    var first = box.querySelector(".opt"); if (first) first.focus({ preventScroll: true });
  }

  function answer(btn, item) {
    var right = btn.dataset.right === "1";
    if (right) score++;
    Array.prototype.forEach.call($("options").children, function (b) {
      b.disabled = true;
      if (b.dataset.right === "1") b.classList.add("correct");
    });
    if (!right) btn.classList.add("wrong");
    $("score").textContent = "נקודות: " + score;
    var fb = $("feedback");
    fb.className = "feedback show " + (right ? "good" : "bad");
    fb.innerHTML = "";
    var head = document.createElement("b"); head.textContent = right ? "נכון, כל הכבוד!" : "לא בדיוק...";
    fb.appendChild(head); fb.appendChild(document.createTextNode(item.why));
    var next = $("next");
    next.textContent = current === QUESTIONS.length - 1 ? "לתוצאה" : "לשאלה הבאה";
    next.classList.remove("hidden"); next.focus({ preventScroll: true });
  }

  function nextQ() {
    current++;
    if (current < QUESTIONS.length) { show(); return; }
    $("bar").style.width = "100%";
    $("quiz").classList.add("hidden"); $("end").classList.remove("hidden");
    $("final").textContent = score + " / " + QUESTIONS.length;
    var p = score / QUESTIONS.length;
    $("msg").textContent = p === 1 ? "מושלם! אתם מומחים לעמק החולה!"
      : p >= 0.75 ? "מצוין! אתם מכירים את עמק החולה ממש טוב."
      : p >= 0.5 ? "יפה! שווה לחזור על השיעור ולנסות שוב."
      : "כדאי לחזור על השיעור ולנסות שוב. בהצלחה!";
    $("again").focus({ preventScroll: true });
  }

  $("go").addEventListener("click", start);
  $("next").addEventListener("click", nextQ);
  $("again").addEventListener("click", start);
</script>
</body>
</html>
